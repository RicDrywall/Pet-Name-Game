<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe7" />
  <title>Whose Pet Is It?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="start-screen" class="screen active">
      <div class="card hero-card">
        <div class="eyebrow">PET MATCHING GAME</div>
        <h1>🐾 Whose Pet Is It?</h1>
        <p class="lead">
          Look at each pet, choose who you think owns them, and see how many you can get right.
        </p>

        <div class="instructions">
          <div><strong>5</strong><span>Pets</span></div>
          <div><strong>5</strong><span>Owners</span></div>
          <div><strong>1</strong><span>Point each</span></div>
        </div>

        <button id="start-button" class="primary-button">Start Game</button>
      </div>
    </section>

    <section id="game-screen" class="screen" aria-live="polite">
      <div class="game-header">
        <div>
          <div class="eyebrow">WHOSE PET IS IT?</div>
          <div id="round-label" class="round-label">Round 1 of 5</div>
        </div>
        <div class="score-box">
          <span>Score</span>
          <strong id="score-label">0</strong>
        </div>
      </div>

      <div class="card game-card">
        <div class="image-frame">
          <img id="pet-image" src="" alt="" />
        </div>

        <div class="pet-info">
          <p class="small-label">PET NAME</p>
          <h2 id="pet-name"></h2>
          <p class="question">Who is the owner?</p>
        </div>

        <div id="answer-grid" class="answer-grid"></div>

        <div id="feedback" class="feedback" role="status"></div>

        <button id="next-button" class="primary-button hidden">Next Pet</button>
      </div>
    </section>

    <section id="end-screen" class="screen">
      <div class="card hero-card">
        <div class="eyebrow">FINAL SCORE</div>
        <h1>🎉 Game Over!</h1>
        <div id="final-score" class="final-score">0 / 5</div>
        <p id="final-message" class="lead"></p>
        <button id="restart-button" class="primary-button">Play Again</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
